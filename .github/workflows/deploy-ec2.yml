name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/dvmbr/dvmbr-community-app-web
  API_IMAGE: ghcr.io/dvmbr/dvmbr-community-app-api

jobs:
  check-ec2:
    name: Check EC2 availability
    runs-on: ubuntu-latest
    outputs:
      reachable: ${{ steps.reachability.outputs.reachable }}

    steps:
      - name: Check HTTP port reachability
        id: reachability
        run: |
          set +e

          if timeout 10 bash -c "</dev/tcp/${{ secrets.EC2_HOST }}/80"; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "EC2 is reachable on port 80."
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "EC2 is not reachable on port 80. Build and deploy will be skipped."
          fi

  build:
    name: Build and push images
    needs: check-ec2
    if: ${{ needs.check-ec2.outputs.reachable == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy on EC2
    needs: build
    runs-on: self-hosted

    steps:
      - name: Deploy on EC2
        run: |
          set -e

          cd /home/ubuntu/dvmbr-community-app
          git fetch origin main
          git reset --hard origin/main

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker image prune -f
